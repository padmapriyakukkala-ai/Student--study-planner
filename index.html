<!DOCTYPE html>
<html>
<head>
    <title>Student Study Planner</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 30px 20px;
            text-align: center;
        }

        h1 {
            color: #243b64;
            font-size: 32px;
            margin-top: 30px;
        }

        p {
            color: #666;
            font-size: 16px;
        }

        h2 {
            color: #243b64;
            margin-top: 35px;
        }

        input {
            padding: 12px;
            width: 220px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            padding: 12px 18px;
            margin-left: 8px;
            border: none;
            border-radius: 8px;
            background: #243b64;
            color: white;
            font-size: 16px;
        }

        ul {
            list-style: none;
            padding: 0;
            margin-top: 20px;
        }
li {
    background: white;
    margin: 12px auto;
    padding: 16px 18px;
    max-width: 450px;
    border-radius: 12px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    display: flex;
    align-items: center;
    gap: 14px;
    text-align: left;
    font-size: 17px;
}

li input[type="checkbox"] {
    width: 21px;
    height: 21px;
    margin: 0;
    flex-shrink: 0;
}

li span {
    flex: 1;
    font-size: 17px;
}
        
    </style>
</head>

<body>

    <h1>Student Study Planner</h1>

    <p>Plan your studies and track your progress.</p>

    <h2>My Subjects</h2>

    <input type="text" id="subject" placeholder="Enter subject">

    <button onclick="addSubject()">Add Subject</button>

    <ul id="subjectList"></ul>
    <h2>Study Tasks</h2>

<input type="text" id="task" placeholder="Enter study task">

<button onclick="addTask()">Add Task</button>

<ul id="taskList"></ul>

    <script src="script.js"></script>

</body>
</html>
